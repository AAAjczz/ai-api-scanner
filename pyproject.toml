[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-scanner"
version = "0.5.0"
description = "Scan any OpenAI-compatible API endpoint for security misconfigurations"
readme = "README.md"
license = "MIT"
authors = [
    {name = "AAAjczz"},
]
keywords = [
    "api", "security", "scanner", "openai", "llm", "devsecops",
    "penetration-testing", "infosec", "ci-cd", "sast",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[project.urls]
Homepage = "https://github.com/AAAjczz/ai-api-scanner"
Repository = "https://github.com/AAAjczz/ai-api-scanner"
Issues = "https://github.com/AAAjczz/ai-api-scanner/issues"

[project.scripts]
ai-api-scanner = "ai_api_scanner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "ai_api_scanner",
    "ai_api_scanner.core",
    "ai_api_scanner.rules",
]
